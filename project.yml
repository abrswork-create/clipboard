name: Clipmory
options:
  bundleIdPrefix: com.clipmory
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true
  settingPresets: app

settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.clipmory.app
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: complete
    ARCHS: "$(ARCHS_STANDARD)"
    ONLY_ACTIVE_ARCH: NO

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0

targets:
  Clipmory:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    dependencies:
      - package: Sparkle
        product: Sparkle
        weak: true
    sources:
      - path: Clipmory
        excludes:
          - "**/.DS_Store"
          - "Resources/Info-AppStore.plist"
          - "Resources/Clipmory-AppStore.entitlements"
    resources:
      - path: Clipmory/Resources/Assets.xcassets
      - path: Clipmory/Resources/Info.plist
    info:
      path: Clipmory/Resources/Info.plist
      properties:
        CFBundleName: Clipmory
        CFBundleDisplayName: Clipmory
        CFBundleShortVersionString: "1.0.1"
        CFBundleVersion: "2"
        LSApplicationCategoryType: "public.app-category.utilities"
        NSPasteboardUsageDescription: "Clipmory stores your clipboard history locally on your Mac so you can access it anytime."
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        SUFeedURL: "https://clipmory.app/appcast.xml"
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    settings:
      base:
        PRODUCT_NAME: Clipmory
        INFOPLIST_FILE: Clipmory/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Clipmory/Resources/Clipmory.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_STRICT_CONCURRENCY: complete

  Clipmory-AppStore:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Clipmory
        excludes:
          - "**/.DS_Store"
          - "Resources/Info.plist"
          - "Resources/Clipmory.entitlements"
    resources:
      - path: Clipmory/Resources/Assets.xcassets
        - path: Clipmory/Resources/Info-AppStore.plist
    info:
      path: Clipmory/Resources/Info-AppStore.plist
      properties:
        CFBundleName: Clipmory
        CFBundleDisplayName: Clipmory
        CFBundleShortVersionString: "1.0.1"
        CFBundleVersion: "2"
        LSApplicationCategoryType: "public.app-category.utilities"
        NSPasteboardUsageDescription: "Clipmory stores your clipboard history locally on your Mac so you can access it anytime."
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
    settings:
      base:
        PRODUCT_NAME: Clipmory
        INFOPLIST_FILE: Clipmory/Resources/Info-AppStore.plist
        CODE_SIGN_ENTITLEMENTS: Clipmory/Resources/Clipmory-AppStore.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APP_STORE"
        SWIFT_STRICT_CONCURRENCY: complete

  ClipmoryTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: ClipmoryTests
    dependencies:
      - target: Clipmory
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
