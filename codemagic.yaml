# Codemagic CI/CD configuration for Clipmory (macOS)
# Documentation: https://docs.codemagic.io/yaml-code-signing/signing-macos/

workflows:
  macos-appstore-publish:
    name: Clipmory Mac App Store Publish
    max_build_duration: 45
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: publisher
    environment:
      xcode: latest
      groups:
        - appstore_credentials
      vars:
        BUNDLE_ID: "com.clipmory.app"
    scripts:
      - name: Make build scripts executable
        script: chmod +x ./scripts/*.sh
      - name: Initialize keychain
        script: keychain initialize
      - name: Set up signing private key
        script: |
          if [ -z "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "CERTIFICATE_PRIVATE_KEY not set in UI, generating RSA 2048 key automatically..."
            ssh-keygen -t rsa -b 2048 -m PEM -f /tmp/mac_cert_key -q -N ""
            echo "CERTIFICATE_PRIVATE_KEY<<EOF" >> $CM_ENV
            cat /tmp/mac_cert_key >> $CM_ENV
            echo "EOF" >> $CM_ENV
            export CERTIFICATE_PRIVATE_KEY=$(cat /tmp/mac_cert_key)
          fi
      - name: Fetch Mac App Store provisioning profiles & certificates
        script: |
          if [ -z "$CERTIFICATE_PRIVATE_KEY" ] && [ -f /tmp/mac_cert_key ]; then
            export CERTIFICATE_PRIVATE_KEY=$(cat /tmp/mac_cert_key)
          fi
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --platform MAC_OS \
            --type MAC_APP_STORE \
            --create
      - name: Fetch or create Mac App Distribution certificates
        script: |
          if [ -z "$CERTIFICATE_PRIVATE_KEY" ] && [ -f /tmp/mac_cert_key ]; then
            export CERTIFICATE_PRIVATE_KEY=$(cat /tmp/mac_cert_key)
          fi
          app-store-connect certificates create --type MAC_APP_DISTRIBUTION --save || \
          app-store-connect certificates list --type MAC_APP_DISTRIBUTION --save || true
      - name: Fetch or create Mac Installer Distribution certificates
        script: |
          if [ -z "$CERTIFICATE_PRIVATE_KEY" ] && [ -f /tmp/mac_cert_key ]; then
            export CERTIFICATE_PRIVATE_KEY=$(cat /tmp/mac_cert_key)
          fi
          app-store-connect certificates create --type MAC_INSTALLER_DISTRIBUTION --save || \
          app-store-connect certificates list --type MAC_INSTALLER_DISTRIBUTION --save || true
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Apply provisioning profile to Xcode project
        script: xcode-project use-profiles
      - name: Build Mac App Store target
        script: |
          xcodebuild -project ClipFlow.xcodeproj \
            -scheme ClipFlow \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "./build/DerivedData-AppStore" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS="APP_STORE" \
            CODE_SIGN_ENTITLEMENTS="ClipFlow/Resources/ClipFlow-AppStore.entitlements" \
            build
      - name: Package signed .pkg installer for App Store Connect
        script: |
          set -e
          BUILD_APP="./build/DerivedData-AppStore/Build/Products/Release/ClipFlow.app"
          DIST_DIR="./dist/appstore"
          rm -rf "$DIST_DIR"
          mkdir -p "$DIST_DIR"
          cp -R "$BUILD_APP" "$DIST_DIR/Clipmory.app"

          # 1. Remove Sparkle (Strictly prohibited by Mac App Store rules; updates are handled by macOS App Store)
          echo "Removing Sparkle framework and updater keys for Mac App Store sandbox compliance..."
          rm -rf "$DIST_DIR/Clipmory.app/Contents/Frameworks/Sparkle.framework"
          /usr/libexec/PlistBuddy -c "Delete :SUFeedURL" "$DIST_DIR/Clipmory.app/Contents/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Delete :SUEnableAutomaticChecks" "$DIST_DIR/Clipmory.app/Contents/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Delete :SUScheduledCheckInterval" "$DIST_DIR/Clipmory.app/Contents/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Delete :SUPublicEDKey" "$DIST_DIR/Clipmory.app/Contents/Info.plist" 2>/dev/null || true

          # 2. Embed provisioning profile into app bundle
          PROFILES=$(find "$HOME/Library/MobileDevice/Provisioning Profiles" -name "*.provisionprofile" 2>/dev/null || true)
          if [ -n "$PROFILES" ]; then
            LATEST_PROFILE=$(ls -t "$HOME/Library/MobileDevice/Provisioning Profiles/"*.provisionprofile | head -n 1)
            echo "Embedding provisioning profile: $LATEST_PROFILE"
            cp "$LATEST_PROFILE" "$DIST_DIR/Clipmory.app/Contents/embedded.provisionprofile"
          fi

          # 3. Discover certificates in keychain
          echo "=== Keychain Signing Identities ==="
          security find-identity -v

          APP_CERT=$(security find-identity -v | grep -E "3rd Party Mac Developer Application|Apple Distribution|Mac App Distribution" | head -n 1 | sed -e 's/.*"\(.*\)".*/\1/')
          INSTALLER_CERT=$(security find-identity -v | grep -i "Installer" | head -n 1 | sed -e 's/.*"\(.*\)".*/\1/')

          echo "Selected App Certificate: '$APP_CERT'"
          echo "Selected Installer Certificate: '$INSTALLER_CERT'"

          if [ -z "$APP_CERT" ]; then
            echo "❌ ERROR: No Mac App Distribution certificate found in keychain!"
            exit 1
          fi

          if [ -z "$INSTALLER_CERT" ]; then
            echo "❌ ERROR: No Mac Installer Distribution certificate found in keychain!"
            exit 1
          fi

          # 4. Sign application bundle with App Sandbox entitlements & runtime options
          codesign --force --verify --verbose --sign "$APP_CERT" \
            --options runtime \
            --entitlements "ClipFlow/Resources/ClipFlow-AppStore.entitlements" \
            "$DIST_DIR/Clipmory.app"

          # 5. Build package component with productbuild, then sign with productsign (natively whitelisted by Codemagic)
          echo "Building package component..."
          xcrun productbuild --component "$DIST_DIR/Clipmory.app" /Applications/ unsigned.pkg

          echo "Signing package with productsign using '$INSTALLER_CERT'..."
          CM_KC=$(find "$HOME/Library/codemagic-cli-tools/keychains" -name "*.keychain-db" 2>/dev/null | head -n 1)
          if [ -n "$CM_KC" ]; then
            xcrun productsign --keychain "$CM_KC" --sign "$INSTALLER_CERT" unsigned.pkg "$DIST_DIR/Clipmory.pkg"
          else
            xcrun productsign --sign "$INSTALLER_CERT" unsigned.pkg "$DIST_DIR/Clipmory.pkg"
          fi
          rm -f unsigned.pkg

          # 6. Verify pkg signature
          pkgutil --check-signature "$DIST_DIR/Clipmory.pkg"

          ditto -c -k --sequesterRsrc --keepParent "$DIST_DIR/Clipmory.app" "$DIST_DIR/Clipmory-AppStore.zip"
    artifacts:
      - dist/appstore/*.pkg
      - dist/appstore/*.zip
      - dist/appstore/*.app
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  macos-web-dmg:
    name: Clipmory Web DMG Release
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Make build scripts executable
        script: chmod +x ./scripts/*.sh
      - name: Build Direct Web DMG
        script: ./scripts/build_web_dmg.sh
    artifacts:
      - dist/web/*.dmg
      - dist/web/*.zip
