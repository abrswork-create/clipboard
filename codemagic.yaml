# Codemagic CI/CD configuration for Clipmory (macOS)
# Documentation: https://docs.codemagic.io/yaml-code-signing/signing-macos/

workflows:
  macos-appstore-publish:
    name: Clipmory Mac App Store Publish
    max_build_duration: 45
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: publisher
    environment:
      xcode: latest
      groups:
        - appstore_credentials
      vars:
        BUNDLE_ID: "com.clipmory.app"
    scripts:
      - name: Make build scripts executable
        script: chmod +x ./scripts/*.sh
      - name: Initialize keychain
        script: keychain initialize
      - name: Fetch Mac App Store provisioning profiles & certificates
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --platform MAC_OS \
            --type MAC_APP_STORE \
            --create
      - name: Fetch Mac App Distribution certificates
        script: |
          app-store-connect certificates list --type MAC_APP_DISTRIBUTION --save || \
          app-store-connect certificates create --type MAC_APP_DISTRIBUTION --save
      - name: Fetch Mac Installer Distribution certificates
        script: |
          app-store-connect certificates list --type MAC_INSTALLER_DISTRIBUTION --save || \
          app-store-connect certificates create --type MAC_INSTALLER_DISTRIBUTION --save
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Apply provisioning profile to Xcode project
        script: xcode-project use-profiles
      - name: Build Mac App Store target
        script: |
          xcodebuild -project ClipFlow.xcodeproj \
            -scheme ClipFlow \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "./build/DerivedData-AppStore" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS="APP_STORE" \
            CODE_SIGN_ENTITLEMENTS="ClipFlow/Resources/ClipFlow-AppStore.entitlements" \
            build
      - name: Package signed .pkg installer for App Store Connect
        script: |
          set -e
          BUILD_APP="./build/DerivedData-AppStore/Build/Products/Release/ClipFlow.app"
          DIST_DIR="./dist/appstore"
          rm -rf "$DIST_DIR"
          mkdir -p "$DIST_DIR"
          cp -R "$BUILD_APP" "$DIST_DIR/Clipmory.app"

          # Sign application bundle with App Sandbox entitlements
          APP_CERT=$(keychain list-certificates | jq -r '.[] | select(.common_name | contains("Apple Distribution") or contains("3rd Party Mac Developer Application")) | .common_name' | head -n 1)
          if [ -n "$APP_CERT" ]; then
            codesign --force --verify --verbose --sign "$APP_CERT" --entitlements "ClipFlow/Resources/ClipFlow-AppStore.entitlements" "$DIST_DIR/Clipmory.app"
          fi

          # Find Installer Certificate
          INSTALLER_CERT=$(keychain list-certificates | jq -r '.[] | select(.common_name | contains("3rd Party Mac Developer Installer") or contains("Mac Installer Distribution")) | .common_name' | head -n 1)

          if [ -n "$INSTALLER_CERT" ]; then
            xcrun productbuild --component "$DIST_DIR/Clipmory.app" /Applications/ --sign "$INSTALLER_CERT" "$DIST_DIR/Clipmory.pkg"
          else
            xcrun productbuild --component "$DIST_DIR/Clipmory.app" /Applications/ "$DIST_DIR/Clipmory.pkg"
          fi
          ditto -c -k --sequesterRsrc --keepParent "$DIST_DIR/Clipmory.app" "$DIST_DIR/Clipmory-AppStore.zip"
    artifacts:
      - dist/appstore/*.pkg
      - dist/appstore/*.zip
      - dist/appstore/*.app
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  macos-web-dmg:
    name: Clipmory Web DMG Release
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Make build scripts executable
        script: chmod +x ./scripts/*.sh
      - name: Build Direct Web DMG
        script: ./scripts/build_web_dmg.sh
    artifacts:
      - dist/web/*.dmg
      - dist/web/*.zip
