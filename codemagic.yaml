# Codemagic CI/CD configuration for Clipmory (macOS)
# Documentation: https://docs.codemagic.io/yaml-code-signing/signing-macos/

workflows:
  macos-appstore-publish:
    name: Clipmory Mac App Store Publish
    max_build_duration: 45
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: publisher
    environment:
      xcode: latest
      groups:
        - appstore_credentials
      vars:
        BUNDLE_ID: "com.clipmory.app"
    scripts:
      - name: Make build scripts executable
        script: chmod +x ./scripts/*.sh
      - name: Initialize keychain
        script: keychain initialize
      - name: Set up signing private key
        script: |
          if [ -n "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "Formatting existing CERTIFICATE_PRIVATE_KEY to standard RSA PEM..."
            echo "$CERTIFICATE_PRIVATE_KEY" > /tmp/raw_key.txt
            if ! grep -q "BEGIN" /tmp/raw_key.txt; then
              (echo "-----BEGIN PRIVATE KEY-----"; cat /tmp/raw_key.txt; echo "-----END PRIVATE KEY-----") > /tmp/wrapped_key.txt
            else
              cp /tmp/raw_key.txt /tmp/wrapped_key.txt
            fi
            openssl rsa -in /tmp/wrapped_key.txt -traditional -out /tmp/mac_cert_key 2>/dev/null || cp /tmp/wrapped_key.txt /tmp/mac_cert_key
          else
            echo "CERTIFICATE_PRIVATE_KEY not set in UI, generating RSA 2048 key automatically..."
            ssh-keygen -t rsa -b 2048 -m PEM -f /tmp/mac_cert_key -q -N ""
          fi
          echo "CERTIFICATE_PRIVATE_KEY<<EOF" >> $CM_ENV
          cat /tmp/mac_cert_key >> $CM_ENV
          echo "EOF" >> $CM_ENV
          export CERTIFICATE_PRIVATE_KEY=$(cat /tmp/mac_cert_key)
          echo "Signing private key prepared successfully."
      - name: Fetch Mac App Store provisioning profiles & certificates
        script: |
          if [ -f /tmp/mac_cert_key ]; then
            export CERTIFICATE_PRIVATE_KEY=$(cat /tmp/mac_cert_key)
          fi
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --platform MAC_OS \
            --type MAC_APP_STORE \
            --create
      - name: Fetch or list Mac Distribution certificates
        script: |
          if [ -f /tmp/mac_cert_key ]; then
            export CERTIFICATE_PRIVATE_KEY=$(cat /tmp/mac_cert_key)
          fi
          app-store-connect certificates list --type MAC_APP_DISTRIBUTION --save || true
          app-store-connect certificates list --type DISTRIBUTION --save || true
      - name: Fetch or create Mac Installer Distribution certificates
        script: |
          if [ -f /tmp/mac_cert_key ]; then
            export CERTIFICATE_PRIVATE_KEY=$(cat /tmp/mac_cert_key)
          fi
          app-store-connect certificates list --type MAC_INSTALLER_DISTRIBUTION --save || \
          app-store-connect certificates create --type MAC_INSTALLER_DISTRIBUTION --save || true
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Apply provisioning profile to Xcode project
        script: xcode-project use-profiles
      - name: Build Mac App Store target
        script: |
          xcodebuild -project Clipmory.xcodeproj \
            -scheme Clipmory-AppStore \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "./build/DerivedData-AppStore" \
            build
      - name: Package signed .pkg installer for App Store Connect
        script: |
          set -e
          BUILD_APP=$(find ./build/DerivedData-AppStore/Build/Products/Release -maxdepth 1 -name "*.app" | head -n 1)
          DIST_DIR="./dist/appstore"
          rm -rf "$DIST_DIR"
          mkdir -p "$DIST_DIR"
          cp -R "$BUILD_APP" "$DIST_DIR/Clipmory.app"

          # 1. Remove any stray Sparkle or non-sandbox keys if present
          rm -rf "$DIST_DIR/Clipmory.app/Contents/Frameworks/Sparkle.framework"
          /usr/libexec/PlistBuddy -c "Delete :SUFeedURL" "$DIST_DIR/Clipmory.app/Contents/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Delete :SUEnableAutomaticChecks" "$DIST_DIR/Clipmory.app/Contents/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Delete :SUScheduledCheckInterval" "$DIST_DIR/Clipmory.app/Contents/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Delete :SUPublicEDKey" "$DIST_DIR/Clipmory.app/Contents/Info.plist" 2>/dev/null || true

          # 2. Discover and embed latest provisioning profile
          PROFILES=$(find "$HOME/Library/MobileDevice/Provisioning Profiles" -name "*.provisionprofile" 2>/dev/null || true)
          if [ -z "$PROFILES" ]; then
            echo "❌ ERROR: No provisioning profile found!"
            exit 1
          fi

          LATEST_PROFILE=$(ls -t "$HOME/Library/MobileDevice/Provisioning Profiles/"*.provisionprofile | head -n 1)
          echo "Embedding provisioning profile: $LATEST_PROFILE"
          cp "$LATEST_PROFILE" "$DIST_DIR/Clipmory.app/Contents/embedded.provisionprofile"

          # 3. Decode provisioning profile to extract certificate fingerprint, Team ID, and App ID
          security cms -D -i "$LATEST_PROFILE" > /tmp/profile.plist
          
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" /tmp/profile.plist 2>/dev/null || echo "")
          APP_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.application-identifier" /tmp/profile.plist 2>/dev/null || echo "")
          if [ -z "$APP_ID" ] && [ -n "$TEAM_ID" ]; then
            APP_ID="${TEAM_ID}.${BUNDLE_ID}"
          fi
          echo "Profile Team ID: '$TEAM_ID'"
          echo "Profile App ID:  '$APP_ID'"

          /usr/libexec/PlistBuddy -c "Print :DeveloperCertificates:0" /tmp/profile.plist > /tmp/cert.der
          PROFILE_CERT_SHA1=$(openssl x509 -inform der -in /tmp/cert.der -noout -fingerprint -sha1 | cut -d'=' -f2 | tr -d ':')
          echo "Certificate SHA-1 in profile: '$PROFILE_CERT_SHA1'"

          echo "=== Keychain Signing Identities ==="
          security find-identity -v

          APP_CERT="$PROFILE_CERT_SHA1"
          if ! security find-identity -v | grep -i "$PROFILE_CERT_SHA1" >/dev/null 2>&1; then
            echo "⚠️ Warning: Exact profile SHA-1 ($PROFILE_CERT_SHA1) not matched in find-identity output, falling back to name search..."
            APP_CERT=$(security find-identity -v | grep -E "Apple Distribution|Mac App Distribution|3rd Party Mac Developer Application" | head -n 1 | sed -e 's/.*"\(.*\)".*/\1/')
          fi

          INSTALLER_CERT=$(security find-identity -v | grep -i "Installer" | head -n 1 | sed -e 's/.*"\(.*\)".*/\1/')

          echo "Selected App Certificate: '$APP_CERT'"
          echo "Selected Installer Certificate: '$INSTALLER_CERT'"

          if [ -z "$APP_CERT" ]; then
            echo "❌ ERROR: No Mac App Distribution certificate found in keychain!"
            exit 1
          fi

          if [ -z "$INSTALLER_CERT" ]; then
            echo "❌ ERROR: No Mac Installer Distribution certificate found in keychain!"
            exit 1
          fi

          # 4. Prepare entitlements with required application-identifier & team-identifier
          cp "Clipmory/Resources/Clipmory-AppStore.entitlements" /tmp/signing_entitlements.plist
          if [ -n "$APP_ID" ]; then
            /usr/libexec/PlistBuddy -c "Add :com.apple.application-identifier string $APP_ID" /tmp/signing_entitlements.plist 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :com.apple.application-identifier $APP_ID" /tmp/signing_entitlements.plist
          fi
          if [ -n "$TEAM_ID" ]; then
            /usr/libexec/PlistBuddy -c "Add :com.apple.developer.team-identifier string $TEAM_ID" /tmp/signing_entitlements.plist 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :com.apple.developer.team-identifier $TEAM_ID" /tmp/signing_entitlements.plist
          fi

          echo "=== Signing Entitlements ==="
          cat /tmp/signing_entitlements.plist

          # Sign application bundle with App Sandbox entitlements & runtime options
          codesign --force --verify --verbose --sign "$APP_CERT" \
            --options runtime \
            --entitlements /tmp/signing_entitlements.plist \
            "$DIST_DIR/Clipmory.app"

          echo "=== Verified Bundle Entitlements ==="
          codesign -d --entitlements :- "$DIST_DIR/Clipmory.app"

          # 5. Build package component with productbuild, then sign with productsign
          echo "Building package component..."
          xcrun productbuild --component "$DIST_DIR/Clipmory.app" /Applications/ unsigned.pkg

          echo "Signing package with productsign using '$INSTALLER_CERT'..."
          CM_KC=$(find "$HOME/Library/codemagic-cli-tools/keychains" -name "*.keychain-db" 2>/dev/null | head -n 1)
          if [ -n "$CM_KC" ]; then
            xcrun productsign --keychain "$CM_KC" --sign "$INSTALLER_CERT" unsigned.pkg "$DIST_DIR/Clipmory.pkg"
          else
            xcrun productsign --sign "$INSTALLER_CERT" unsigned.pkg "$DIST_DIR/Clipmory.pkg"
          fi
          rm -f unsigned.pkg

          # 6. Verify pkg signature
          pkgutil --check-signature "$DIST_DIR/Clipmory.pkg"

          ditto -c -k --sequesterRsrc --keepParent "$DIST_DIR/Clipmory.app" "$DIST_DIR/Clipmory-AppStore.zip"
    artifacts:
      - dist/appstore/*.pkg
      - dist/appstore/*.zip
      - dist/appstore/*.app
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false

  macos-web-dmg:
    name: Clipmory Web DMG Release
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Make build scripts executable
        script: chmod +x ./scripts/*.sh
      - name: Build Direct Web DMG
        script: ./scripts/build_web_dmg.sh
    artifacts:
      - dist/web/*.dmg
      - dist/web/*.zip
